[project]
name = "quail-playground"
version = "0.1.0"
description = "A web demo of Quail: four AI-SQL queries on three models, served by Quail Server on Modal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    # the engine and its optional query server; the pin is a commit of
    # https://github.com/fsdatalab/quail
    "quail-engine[server]",
    # the benchmark: the BIO corpus at scale factor 0.1 and the
    # prefix-trie count behind KV regret
    "quail-b",
    "modal[api-proxy-support]==1.5.4",
    "hf-transfer==0.1.9",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.12.9",
]

[tool.uv.sources]
quail-engine = { git = "https://github.com/fsdatalab/quail.git", rev = "09c40b3cae37f9ea6cfb917361073452ea850ef9" }
quail-b = { git = "https://github.com/fsdatalab/quail-bench.git", rev = "35d026dc2f5b5c1e787268173e81e512b749081a" }

[tool.uv]
# the same uv the Modal image syncs with
required-version = "==0.12.13"
# every transitive version pinned to quail's own uv.lock at the commit
# above, so the GPU stack here is the one quail tests; regenerate with
