[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["playground"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# the same rules as quail: pycodestyle, pyflakes, import order, naming,
# Google style docstrings; missing docstrings are not flagged
select = ["E", "F", "W", "I", "N", "D"]
ignore = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["playground", "quail", "quail_b"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
