<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quail playground</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/svg+xml" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="brand-name">Quail playground</span>
    <span class="brand-sub">Full Stack Data Lab, runs on Modal</span>
  </div>
  <nav id="nav" class="tabs" aria-label="Demo areas" role="tablist"></nav>
  <div class="top-right">
    <span id="server-state" class="server-state">—</span>
    <a href="https://github.com/fsdatalab/quail-playground">Playground code</a>
    <a class="star-link" href="https://github.com/fsdatalab/quail">&#9733; Star Quail on GitHub</a>
  </div>
</header>
<main>
  <section class="request">
    <span class="method">POST</span>
    <span id="endpoint" class="endpoint mono">…</span>
    <span class="mono">/v1/queries</span>
    <span id="query-id" class="mono query-id"></span>
    <span class="spacer"></span>
    <span id="state" class="state idle">IDLE</span>
    <span id="timer" class="timer mono">0.0 s</span>
    <button id="download" disabled>Download results</button>
    <button id="cancel" disabled>Cancel</button>
    <button id="run" class="primary">Run</button>
  </section>
  <div id="query-error" class="query-error" role="alert" hidden></div>

  <section class="split">
    <div class="pane">
      <div class="pane-head">
        <span id="demo-title" class="pane-title">Query</span>
        <nav id="query-nav" class="query-tabs" aria-label="Queries" role="tablist" hidden></nav>
        <span id="model" class="mono muted"></span>
      </div>
      <textarea id="sql" class="sql" aria-label="SQL query" spellcheck="false"></textarea>
      <p class="note">
        <span><span class="note-label">Default query explanation:</span> <span id="note"></span></span>
        <em class="query-limit-note">If you edit the query and enter no LIMIT, we will apply LIMIT 1000, so the page returns at most 1,000 rows.</em>
      </p>
    </div>
    <div class="pane">
      <div class="pane-head">
        <span class="pane-tabs">
          <button class="pane-tab active" data-pane="plan">Plan</button>
          <button class="pane-tab" data-pane="events">Events <span id="events-count"></span></button>
        </span>
        <span id="progress" class="mono muted"></span>
      </div>
      <pre id="plan" class="plan"></pre>
      <ol id="events" class="events" hidden></ol>
    </div>
  </section>

  <section id="cards" class="cards"></section>

  <section id="viz" class="viz"></section>

</main>
<script src="/static/app.js"></script>
</body>
</html>
